apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina360-api
  namespace: oficina360
  annotations:
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: oficina360-api
                port:
                  number: 8080
