name: Infrastructure Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oficina360-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_project_name: oficina360

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform/lab

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Localizar backend
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="oficina360-tfstate-${ACCOUNT_ID}-${AWS_REGION}"
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          aws s3api head-bucket --bucket "$BUCKET"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=oficina360/lab.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Remover recursos Kubernetes externos ao Terraform
        continue-on-error: true
        run: |
          CLUSTER_NAME="$(terraform output -raw cluster_name)"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          helm uninstall alloy -n observability || true
          helm uninstall grafana -n observability || true
          helm uninstall loki -n observability || true
          helm uninstall kong -n kong || true
          kubectl delete service --all -n observability --ignore-not-found=true || true
          kubectl delete service --all -n kong --ignore-not-found=true || true

      - name: Aguardar remocao dos Load Balancers da VPC
        run: |
          set -euo pipefail
          VPC_ID="$(terraform output -raw vpc_id 2>/dev/null || true)"
          if [[ -z "$VPC_ID" ]]; then
            echo "VPC nao encontrada no state; nada a aguardar."
            exit 0
          fi
          for attempt in $(seq 1 30); do
            CLASSIC="$(aws elb describe-load-balancers \
              --query "length(LoadBalancerDescriptions[?VPCId=='${VPC_ID}'])" \
              --output text)"
            V2="$(aws elbv2 describe-load-balancers \
              --query "length(LoadBalancers[?VpcId=='${VPC_ID}'])" \
              --output text)"
            if [[ "$CLASSIC" == "0" && "$V2" == "0" ]]; then
              echo "Load Balancers removidos. Aguardando a liberacao das interfaces de rede."
              sleep 30
              exit 0
            fi
            echo "Aguardando Load Balancers (classic=$CLASSIC, v2=$V2) - tentativa $attempt/30"
            sleep 10
          done
          echo "::error::Ainda existem Load Balancers na VPC $VPC_ID. Remova-os e execute o workflow novamente."
          exit 1

      - name: Terraform destroy
        run: terraform destroy -auto-approve
