name: Infrastructure Apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acao da infraestrutura
        required: true
        type: choice
        options:
          - validate
          - deploy

      kubernetes_version:
        description: Versao do Kubernetes aceita pelo lab
        required: true
        default: "1.36"
        type: string

permissions:
  contents: read

concurrency:
  group: oficina360-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_project_name: oficina360
  TF_VAR_kubernetes_version: ${{ inputs.kubernetes_version }}

jobs:
  infrastructure:
    name: Infrastructure ${{ inputs.action }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: terraform/lab

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Terraform format
        run: terraform fmt -check -recursive

      # Validação local, sem acessar o backend S3.
      - name: Terraform init for validation
        if: inputs.action == 'validate'
        run: terraform init -backend=false

      - name: Terraform validate
        if: inputs.action == 'validate'
        env:
          TF_VAR_eks_cluster_role_arn: arn:aws:iam::000000000000:role/validation-LabEksClusterRole-x
          TF_VAR_eks_node_role_arn: arn:aws:iam::000000000000:role/validation-LabEksNodeRole-x
        run: terraform validate

      # A partir daqui somente deploy precisa de AWS.
      - name: Configure AWS credentials
        if: inputs.action == 'deploy'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publicar diagnostico
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learner-lab-permissions
          path: learner-lab-permissions.txt
          retention-days: 1

      - name: Definir backend Terraform
        if: inputs.action == 'deploy'
        working-directory: .
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          BUCKET="oficina360-tfstate-${ACCOUNT_ID}-${AWS_REGION}"

          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "Backend configurado: $BUCKET"

      - name: Terraform init with remote backend
        if: inputs.action == 'deploy'
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=oficina360/lab.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate before deploy
        if: inputs.action == 'deploy'
        run: terraform validate

      - name: Descobrir roles EKS do Learner Lab
        if: inputs.action == 'deploy'
        working-directory: .
        run: |
          set -euo pipefail

          CLUSTER_ROLE_ARN="$(
            aws iam list-roles \
              --query "Roles[?contains(RoleName, 'LabEksClusterRole')].Arn | [0]" \
              --output text
          )"

          NODE_ROLE_ARN="$(
            aws iam list-roles \
              --query "Roles[?contains(RoleName, 'LabEksNodeRole')].Arn | [0]" \
              --output text
          )"

          if [[ -z "$CLUSTER_ROLE_ARN" || "$CLUSTER_ROLE_ARN" == "None" ]]; then
            echo "::error::Role LabEksClusterRole não encontrada."
            exit 1
          fi

          if [[ -z "$NODE_ROLE_ARN" || "$NODE_ROLE_ARN" == "None" ]]; then
            echo "::error::Role LabEksNodeRole não encontrada."
            exit 1
          fi

          echo "TF_VAR_eks_cluster_role_arn=$CLUSTER_ROLE_ARN" \
            >> "$GITHUB_ENV"

          echo "TF_VAR_eks_node_role_arn=$NODE_ROLE_ARN" \
            >> "$GITHUB_ENV"

          echo "Cluster role localizada."
          echo "Node role localizada."

      - name: Terraform plan
        if: inputs.action == 'deploy'
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'deploy'
        run: terraform apply -auto-approve tfplan

      - name: Configure kubectl
        if: inputs.action == 'deploy'
        run: |
          CLUSTER_NAME="$(
            terraform output -raw cluster_name
          )"

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

          kubectl get nodes -o wide

      - name: Validate network parameters
        if: inputs.action == 'deploy'
        working-directory: .
        run: |
          aws ssm get-parameters-by-path \
            --path "/oficina360/network" \
            --recursive \
            --query 'Parameters[].{Name:Name,Value:Value}' \
            --output table