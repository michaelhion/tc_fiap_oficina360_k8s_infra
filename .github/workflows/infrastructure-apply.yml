name: Infrastructure Apply

run-name: Infrastructure ${{ inputs.action }} - Kubernetes ${{ inputs.kubernetes_version }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acao da infraestrutura
        required: true
        type: choice
        options:
          - validate
          - deploy

      kubernetes_version:
        description: Versao do Kubernetes aceita pelo lab
        required: true
        default: "1.36"
        type: string

permissions:
  contents: read

concurrency:
  group: oficina360-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_project_name: oficina360
  TF_VAR_kubernetes_version: ${{ inputs.kubernetes_version }}

jobs:
  infrastructure:
    name: Infrastructure ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: terraform/lab

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Mostrar parametros da execucao
        working-directory: .
        run: |
          echo "action=${{ inputs.action }}"
          echo "kubernetes_version=${{ inputs.kubernetes_version }}"
          echo "branch=${GITHUB_REF_NAME}"
          echo "commit=${GITHUB_SHA}"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init for validation
        if: inputs.action == 'validate'
        run: terraform init -backend=false

      - name: Terraform validate
        if: inputs.action == 'validate'
        env:
          TF_VAR_eks_cluster_role_arn: arn:aws:iam::000000000000:role/validation-LabEksClusterRole-x
          TF_VAR_eks_node_role_arn: arn:aws:iam::000000000000:role/validation-LabEksNodeRole-x
        run: terraform validate

      - name: Configure AWS credentials
        if: inputs.action == 'deploy'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar identidade AWS
        if: inputs.action == 'deploy'
        timeout-minutes: 1
        working-directory: .
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Configurar roles EKS
        if: inputs.action == 'deploy'
        timeout-minutes: 1
        working-directory: .
        env:
          EKS_CLUSTER_ROLE_ARN: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
          EKS_NODE_ROLE_ARN: ${{ vars.EKS_NODE_ROLE_ARN }}
        run: |
          set -euo pipefail

          : "${EKS_CLUSTER_ROLE_ARN:?Repository Variable EKS_CLUSTER_ROLE_ARN nao definida}"
          : "${EKS_NODE_ROLE_ARN:?Repository Variable EKS_NODE_ROLE_ARN nao definida}"

          if [[ ! "$EKS_CLUSTER_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+LabEksClusterRole.*$ ]]; then
            echo "::error::EKS_CLUSTER_ROLE_ARN nao aponta para uma LabEksClusterRole valida."
            exit 1
          fi

          if [[ ! "$EKS_NODE_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+LabEksNodeRole.*$ ]]; then
            echo "::error::EKS_NODE_ROLE_ARN nao aponta para uma LabEksNodeRole valida."
            exit 1
          fi

          if [[ "$EKS_CLUSTER_ROLE_ARN" == "$EKS_NODE_ROLE_ARN" ]]; then
            echo "::error::As roles do cluster e do node group nao podem ser iguais."
            exit 1
          fi

          echo "TF_VAR_eks_cluster_role_arn=$EKS_CLUSTER_ROLE_ARN" >> "$GITHUB_ENV"
          echo "TF_VAR_eks_node_role_arn=$EKS_NODE_ROLE_ARN" >> "$GITHUB_ENV"

          echo "Cluster role: ${EKS_CLUSTER_ROLE_ARN##*/}"
          echo "Node role: ${EKS_NODE_ROLE_ARN##*/}"

      - name: Configurar backend Terraform
        if: inputs.action == 'deploy'
        timeout-minutes: 1
        working-directory: .
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'oficina360/lab.tfstate' }}
        run: |
          set -euo pipefail

          : "${TF_STATE_BUCKET:?Repository Variable TF_STATE_BUCKET nao definida}"
          : "${TF_STATE_KEY:?Repository Variable TF_STATE_KEY nao definida}"

          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=$TF_STATE_KEY" >> "$GITHUB_ENV"

          echo "Backend bucket: $TF_STATE_BUCKET"
          echo "Backend key: $TF_STATE_KEY"

      - name: Terraform init with remote backend
        if: inputs.action == 'deploy'
        timeout-minutes: 5
        env:
          AWS_MAX_ATTEMPTS: "2"
          AWS_RETRY_MODE: standard
          AWS_PAGER: ""
        run: |
          set -euo pipefail

          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate before deploy
        if: inputs.action == 'deploy'
        run: terraform validate

      - name: Terraform plan
        if: inputs.action == 'deploy'
        timeout-minutes: 15
        run: |
          set -euo pipefail

          terraform plan -out=tfplan

          terraform show -no-color tfplan > /tmp/tfplan.txt
          terraform show -json tfplan > /tmp/tfplan.json

          echo "===== RESUMO DO PLANO ====="
          grep -E \
            'Plan:|will be imported|will be created|will be updated|will be destroyed|must be replaced' \
            /tmp/tfplan.txt || true

          if grep -q 'aws_eks_cluster.main must be replaced' /tmp/tfplan.txt; then
            echo "::error::O plano tenta substituir o cluster EKS."
            exit 1
          fi

          if grep -q 'aws_eks_cluster.main will be destroyed' /tmp/tfplan.txt; then
            echo "::error::O plano tenta destruir o cluster EKS."
            exit 1
          fi

          if grep -Eq 'Plan: .* [1-9][0-9]* to destroy' /tmp/tfplan.txt; then
            echo "::error::O plano contem recursos para destruir."
            grep 'Plan:' /tmp/tfplan.txt || true
            exit 1
          fi

          NODE_ROLE="$( (jq -r '
            [
              .planned_values.root_module.resources[]?,
              .planned_values.root_module.child_modules[]?.resources[]?
            ]
            | .[]
            | select(.type == "aws_eks_node_group" and .name == "main")
            | .values.node_role_arn
          ' /tmp/tfplan.json 2>/dev/null || true) | head -n 1)"

          if [[ -n "$NODE_ROLE" && "$NODE_ROLE" != "null" ]]; then
            echo "Node role planejada: ${NODE_ROLE##*/}"

            if [[ "$NODE_ROLE" != *LabEksNodeRole* ]]; then
              echo "::error::O node group nao esta usando uma LabEksNodeRole."
              echo "::error::Valor planejado: ${NODE_ROLE##*/}"
              exit 1
            fi

            if [[ "$NODE_ROLE" == *LabEksClusterRole* ]]; then
              echo "::error::Uma cluster role foi configurada no node group."
              exit 1
            fi
          else
            echo "Node group nao aparece no plano ou ja existe no state."
          fi

          echo "Plano aprovado para apply."

      - name: Terraform apply
        if: inputs.action == 'deploy'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          terraform apply -auto-approve tfplan

      - name: Configurar cluster sem DescribeCluster
        if: inputs.action == 'deploy'
        timeout-minutes: 3
        working-directory: .
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          EKS_CLUSTER_ENDPOINT: ${{ vars.EKS_CLUSTER_ENDPOINT }}
          EKS_CLUSTER_CA: ${{ vars.EKS_CLUSTER_CA }}
        run: |
          set -euo pipefail

          : "${EKS_CLUSTER_NAME:?Repository Variable EKS_CLUSTER_NAME nao definida}"
          : "${EKS_CLUSTER_ENDPOINT:?Repository Variable EKS_CLUSTER_ENDPOINT nao definida}"
          : "${EKS_CLUSTER_CA:?Repository Variable EKS_CLUSTER_CA nao definida}"

          bash scripts/configure-eks-kubeconfig.sh

      - name: Validar cluster e node group
        if: inputs.action == 'deploy'
        timeout-minutes: 5
        working-directory: .
        run: |
          set -euo pipefail

          kubectl get nodes -o wide
          kubectl get pods --namespace kube-system --output wide

          READY_NODES="$(kubectl get nodes --no-headers | awk '$2 == "Ready" {count++} END {print count+0}')"

          if [[ "$READY_NODES" -lt 1 ]]; then
            echo "::error::Nenhum node Ready encontrado."
            exit 1
          fi

          echo "Nodes Ready: $READY_NODES"

      - name: Validar parametros de rede
        if: inputs.action == 'deploy'
        timeout-minutes: 2
        working-directory: .
        run: |
          set -euo pipefail

          aws ssm get-parameters-by-path \
            --path "/oficina360/network" \
            --recursive \
            --region "$AWS_REGION" \
            --query 'Parameters[].{Name:Name,Value:Value}' \
            --output table
