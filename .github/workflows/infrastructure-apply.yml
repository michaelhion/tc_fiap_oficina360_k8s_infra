name: Infrastructure Apply

run-name: Infrastructure ${{ inputs.action }} - Kubernetes ${{ inputs.kubernetes_version }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acao da infraestrutura
        required: true
        type: choice
        options:
          - validate
          - deploy

      kubernetes_version:
        description: Versao do Kubernetes aceita pelo lab
        required: true
        default: "1.36"
        type: string

      allow_cluster_replacement:
        description: Permitir recriar o cluster apos reset do Learner Lab
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: oficina360-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_project_name: oficina360
  TF_VAR_kubernetes_version: ${{ inputs.kubernetes_version }}

jobs:
  infrastructure:
    name: Infrastructure ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    defaults:
      run:
        shell: bash
        working-directory: terraform/lab

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Mostrar parametros da execucao
        working-directory: .
        run: |
          echo "action=${{ inputs.action }}"
          echo "kubernetes_version=${{ inputs.kubernetes_version }}"
          echo "allow_cluster_replacement=${{ inputs.allow_cluster_replacement }}"
          echo "branch=${GITHUB_REF_NAME}"
          echo "commit=${GITHUB_SHA}"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init for validation
        if: inputs.action == 'validate'
        run: terraform init -backend=false

      - name: Terraform validate
        if: inputs.action == 'validate'
        env:
          TF_VAR_eks_cluster_role_arn: arn:aws:iam::000000000000:role/validation-LabEksClusterRole-x
          TF_VAR_eks_node_role_arn: arn:aws:iam::000000000000:role/validation-LabEksNodeRole-x
        run: terraform validate

      - name: Configure AWS credentials
        if: inputs.action == 'deploy'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar identidade AWS
        if: inputs.action == 'deploy'
        timeout-minutes: 1
        working-directory: .
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Configurar roles EKS
        if: inputs.action == 'deploy'
        timeout-minutes: 1
        working-directory: .
        env:
          EKS_CLUSTER_ROLE_ARN: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
          EKS_NODE_ROLE_ARN: ${{ vars.EKS_NODE_ROLE_ARN }}
        run: |
          set -euo pipefail

          : "${EKS_CLUSTER_ROLE_ARN:?Repository Variable EKS_CLUSTER_ROLE_ARN nao definida}"
          : "${EKS_NODE_ROLE_ARN:?Repository Variable EKS_NODE_ROLE_ARN nao definida}"

          if [[ ! "$EKS_CLUSTER_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+LabEksClusterRole.*$ ]]; then
            echo "::error::EKS_CLUSTER_ROLE_ARN nao aponta para uma LabEksClusterRole valida."
            exit 1
          fi

          if [[ ! "$EKS_NODE_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+LabEksNodeRole.*$ ]]; then
            echo "::error::EKS_NODE_ROLE_ARN nao aponta para uma LabEksNodeRole valida."
            exit 1
          fi

          if [[ "$EKS_CLUSTER_ROLE_ARN" == "$EKS_NODE_ROLE_ARN" ]]; then
            echo "::error::As roles do cluster e do node group nao podem ser iguais."
            exit 1
          fi

          echo "TF_VAR_eks_cluster_role_arn=$EKS_CLUSTER_ROLE_ARN" >> "$GITHUB_ENV"
          echo "TF_VAR_eks_node_role_arn=$EKS_NODE_ROLE_ARN" >> "$GITHUB_ENV"

          echo "Cluster role: ${EKS_CLUSTER_ROLE_ARN##*/}"
          echo "Node role: ${EKS_NODE_ROLE_ARN##*/}"

      - name: Configurar backend Terraform
        if: inputs.action == 'deploy'
        timeout-minutes: 1
        working-directory: .
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'oficina360/lab.tfstate' }}
        run: |
          set -euo pipefail

          : "${TF_STATE_BUCKET:?Repository Variable TF_STATE_BUCKET nao definida}"
          : "${TF_STATE_KEY:?Repository Variable TF_STATE_KEY nao definida}"

          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=$TF_STATE_KEY" >> "$GITHUB_ENV"

          echo "Backend bucket: $TF_STATE_BUCKET"
          echo "Backend key: $TF_STATE_KEY"

      - name: Terraform init with remote backend
        if: inputs.action == 'deploy'
        timeout-minutes: 5
        env:
          AWS_MAX_ATTEMPTS: "2"
          AWS_RETRY_MODE: standard
          AWS_PAGER: ""
        run: |
          set -euo pipefail

          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate before deploy
        if: inputs.action == 'deploy'
        run: terraform validate

      - name: Terraform plan
        if: inputs.action == 'deploy'
        timeout-minutes: 15
        env:
          ALLOW_CLUSTER_REPLACEMENT: ${{ inputs.allow_cluster_replacement }}
        run: |
          set -euo pipefail

          terraform plan -out=tfplan
          terraform show -no-color tfplan > /tmp/tfplan.txt

          echo "===== RESUMO DO PLANO ====="
          grep -E \
            'Plan:|will be imported|will be created|will be updated|will be destroyed|must be replaced' \
            /tmp/tfplan.txt || true

          CLUSTER_REPLACEMENT="false"
          if grep -q 'aws_eks_cluster.main must be replaced' /tmp/tfplan.txt; then
            CLUSTER_REPLACEMENT="true"

            if [[ "$ALLOW_CLUSTER_REPLACEMENT" != "true" ]]; then
              echo "::error::O plano tenta substituir o cluster EKS."
              echo "::error::Execute novamente com allow_cluster_replacement=true somente apos revisar o plano."
              exit 1
            fi

            echo "::warning::Substituicao do cluster autorizada explicitamente."
          fi

          DESTROY_COUNT="$(
            sed -nE \
              's/^Plan: [0-9]+ to add, [0-9]+ to change, ([0-9]+) to destroy\.$/\1/p' \
              /tmp/tfplan.txt |
            tail -n 1
          )"
          DESTROY_COUNT="${DESTROY_COUNT:-0}"

          if [[ "$DESTROY_COUNT" -gt 0 ]]; then
            if [[ "$ALLOW_CLUSTER_REPLACEMENT" != "true" ]]; then
              echo "::error::O plano contem $DESTROY_COUNT recurso(s) para destruir."
              exit 1
            fi

            if [[ "$CLUSTER_REPLACEMENT" != "true" ]]; then
              echo "::error::Ha destruicoes, mas nenhuma corresponde a substituicao esperada do cluster."
              exit 1
            fi

            UNEXPECTED_DESTROYS="$(
              grep -E '^  # .* (will be destroyed|must be replaced)' /tmp/tfplan.txt |
              grep -v '^  # aws_eks_cluster.main must be replaced' || true
            )"

            if [[ -n "$UNEXPECTED_DESTROYS" ]]; then
              echo "::error::O plano contem destruicoes alem do cluster EKS:"
              echo "$UNEXPECTED_DESTROYS"
              exit 1
            fi
          fi

          PLANNED_NODE_ROLE="$(
            sed -nE \
              's/^[[:space:]]*\+?[[:space:]]*node_role_arn[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              /tmp/tfplan.txt |
            head -n 1
          )"

          if grep -q 'aws_eks_node_group.main will be created' /tmp/tfplan.txt; then
            if [[ -z "$PLANNED_NODE_ROLE" ]]; then
              echo "::error::Nao foi possivel localizar node_role_arn no plano."
              exit 1
            fi

            echo "Node role planejada: ${PLANNED_NODE_ROLE##*/}"

            if [[ "$PLANNED_NODE_ROLE" != *LabEksNodeRole* ]]; then
              echo "::error::O node group nao esta usando uma LabEksNodeRole."
              echo "::error::Valor planejado: ${PLANNED_NODE_ROLE##*/}"
              exit 1
            fi

            if [[ "$PLANNED_NODE_ROLE" == *LabEksClusterRole* ]]; then
              echo "::error::Uma cluster role foi configurada no node group."
              exit 1
            fi
          else
            echo "Node group nao sera criado neste plano ou ja existe no state."
          fi

          if grep -Eq '^  # module\.vpc\..* (will be destroyed|must be replaced)' /tmp/tfplan.txt; then
            echo "::error::O plano tenta destruir ou substituir recursos da VPC."
            exit 1
          fi

          if grep -Eq '^  # aws_security_group\.database_access (will be destroyed|must be replaced)' /tmp/tfplan.txt; then
            echo "::error::O plano tenta destruir ou substituir o Security Group compartilhado."
            exit 1
          fi

          echo "Plano aprovado para apply."

      - name: Terraform apply
        if: inputs.action == 'deploy'
        timeout-minutes: 35
        run: |
          set -euo pipefail
          terraform apply -auto-approve tfplan

      - name: Extrair configuracao atual do cluster
        if: inputs.action == 'deploy'
        timeout-minutes: 2
        run: |
          set -euo pipefail

          terraform show -json > /tmp/terraform-state.json

          EKS_CLUSTER_NAME_CURRENT="$(
            jq -r '
              .values.root_module.resources[]
              | select(.type == "aws_eks_cluster" and .name == "main")
              | .values.name
            ' /tmp/terraform-state.json
          )"

          EKS_CLUSTER_ENDPOINT_CURRENT="$(
            jq -r '
              .values.root_module.resources[]
              | select(.type == "aws_eks_cluster" and .name == "main")
              | .values.endpoint
            ' /tmp/terraform-state.json
          )"

          EKS_CLUSTER_CA_CURRENT="$(
            jq -r '
              .values.root_module.resources[]
              | select(.type == "aws_eks_cluster" and .name == "main")
              | .values.certificate_authority[0].data
            ' /tmp/terraform-state.json
          )"

          : "${EKS_CLUSTER_NAME_CURRENT:?Nome do cluster nao encontrado no state}"
          : "${EKS_CLUSTER_ENDPOINT_CURRENT:?Endpoint do cluster nao encontrado no state}"
          : "${EKS_CLUSTER_CA_CURRENT:?CA do cluster nao encontrado no state}"

          echo "EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME_CURRENT" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER_ENDPOINT=$EKS_CLUSTER_ENDPOINT_CURRENT" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER_CA=$EKS_CLUSTER_CA_CURRENT" >> "$GITHUB_ENV"

          echo "Cluster atual: $EKS_CLUSTER_NAME_CURRENT"
          echo "Endpoint atual obtido do state."

      - name: Configurar cluster sem DescribeCluster
        if: inputs.action == 'deploy'
        timeout-minutes: 3
        working-directory: .
        run: |
          set -euo pipefail
          bash scripts/configure-eks-kubeconfig.sh

      - name: Validar cluster e node group
        if: inputs.action == 'deploy'
        timeout-minutes: 8
        working-directory: .
        run: |
          set -euo pipefail

          kubectl get nodes -o wide
          kubectl get pods --namespace kube-system --output wide

          READY_NODES="$(
            kubectl get nodes --no-headers |
            awk '$2 == "Ready" {count++} END {print count+0}'
          )"

          if [[ "$READY_NODES" -lt 1 ]]; then
            echo "::error::Nenhum node Ready encontrado."
            exit 1
          fi

          echo "Nodes Ready: $READY_NODES"

      - name: Validar parametros de rede
        if: inputs.action == 'deploy'
        timeout-minutes: 2
        working-directory: .
        run: |
          set -euo pipefail

          aws ssm get-parameters-by-path \
            --path "/oficina360/network" \
            --recursive \
            --region "$AWS_REGION" \
            --query 'Parameters[].{Name:Name,Value:Value}' \
            --output table

      - name: Gerar resumo para atualizar Repository Variables
        if: inputs.action == 'deploy'
        working-directory: .
        run: |
          {
            echo "EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME"
            echo "EKS_CLUSTER_ENDPOINT=$EKS_CLUSTER_ENDPOINT"
            echo "EKS_CLUSTER_CA_LENGTH=${#EKS_CLUSTER_CA}"
            echo
            echo "Atualize EKS_CLUSTER_ENDPOINT e EKS_CLUSTER_CA nas Repository Variables antes dos workflows da aplicacao, Kong e observabilidade."
          } | tee cluster-runtime-summary.txt

      - name: Publicar resumo do cluster
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cluster-runtime-summary
          path: cluster-runtime-summary.txt
          if-no-files-found: error
          retention-days: 1
